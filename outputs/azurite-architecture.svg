<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
  <defs>
    <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1.5,1.5 L11,6.5 L1.5,11.5 Z" fill="#256bd6"/>
    </marker>
    <marker id="arrow-green" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1.5,1.5 L11,6.5 L1.5,11.5 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-amber" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1.5,1.5 L11,6.5 L1.5,11.5 Z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 46px; font-weight: 700; fill: #102a43; }
      .kicker { font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 22px; font-weight: 700; fill: #148ca1; }
      .lane { font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 20px; font-weight: 700; fill: #426274; }
      .node-title { font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 29px; font-weight: 700; fill: #102a43; }
      .node-sub { font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 19px; fill: #253b4d; }
      .label { font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 21px; font-weight: 700; fill: #102a43; }
      .small-label { font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 18px; font-weight: 700; fill: #102a43; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; filter: url(#shadow); }
      .label-bg { fill: #f8fafc; stroke: #dbe3ea; stroke-width: 1.5; rx: 8; }
      .stripe-blue { fill: #256bd6; }
      .stripe-teal { fill: #0f766e; }
      .stripe-amber { fill: #d97706; }
      .arrow { fill: none; stroke: #256bd6; stroke-width: 5; marker-end: url(#arrow-blue); }
      .arrow-soft { fill: none; stroke: #256bd6; stroke-width: 4.5; marker-end: url(#arrow-blue); }
      .arrow-db { fill: none; stroke: #d97706; stroke-width: 5; marker-end: url(#arrow-amber); }
      .arrow-mi { fill: none; stroke: #0f766e; stroke-width: 5; stroke-dasharray: 12 10; marker-end: url(#arrow-green); }
      .callout { fill: #eef6ff; stroke: #256bd6; stroke-width: 2.5; rx: 12; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1080"/>
  <text class="kicker" x="90" y="84">ARCHITECTURE</text>
  <text class="title" x="90" y="142">サービス構成図: Azure Blob Storage 直接アップロード</text>

  <text class="lane" x="105" y="225">Client</text>
  <text class="lane" x="520" y="225">App</text>
  <text class="lane" x="985" y="225">Azure Storage</text>
  <text class="lane" x="525" y="700">State</text>
  <text class="lane" x="890" y="700">Identity / Permission</text>

  <rect class="node" x="95" y="252" width="270" height="118" rx="12"/>
  <rect class="stripe-blue" x="95" y="252" width="10" height="118"/>
  <text class="node-title" x="130" y="304">Browser</text>
  <text class="node-sub" x="130" y="344">ファイル選択 / PUT</text>

  <rect class="node" x="505" y="252" width="300" height="118" rx="12"/>
  <rect class="stripe-teal" x="505" y="252" width="10" height="118"/>
  <text class="node-title" x="540" y="304">Web / API</text>
  <text class="node-sub" x="540" y="344">認可・SAS発行・完了確認</text>

  <rect class="node" x="970" y="252" width="300" height="118" rx="12"/>
  <rect class="stripe-blue" x="970" y="252" width="10" height="118"/>
  <text class="node-title" x="1005" y="304">Storage Account</text>
  <text class="node-sub" x="1005" y="344">Blob service</text>

  <rect class="node" x="1450" y="252" width="250" height="118" rx="12"/>
  <rect class="stripe-blue" x="1450" y="252" width="10" height="118"/>
  <text class="node-title" x="1485" y="304">Container</text>
  <text class="node-sub" x="1485" y="344">attachments</text>

  <rect class="node" x="505" y="735" width="300" height="118" rx="12"/>
  <rect class="stripe-amber" x="505" y="735" width="10" height="118"/>
  <text class="node-title" x="540" y="787">Metadata DB</text>
  <text class="node-sub" x="540" y="827">pending / completed / failed</text>

  <rect class="node" x="885" y="735" width="315" height="118" rx="12"/>
  <rect class="stripe-teal" x="885" y="735" width="10" height="118"/>
  <text class="node-title" x="920" y="787">Managed Identity</text>
  <text class="node-sub" x="920" y="827">秘密鍵なしで認証</text>

  <rect class="node" x="1325" y="735" width="315" height="118" rx="12"/>
  <rect class="stripe-amber" x="1325" y="735" width="10" height="118"/>
  <text class="node-title" x="1360" y="787">Azure RBAC</text>
  <text class="node-sub" x="1360" y="827">Blob Data Contributor</text>

  <path class="arrow" d="M365 296 L505 296"/>
  <rect class="label-bg" x="390" y="218" width="125" height="34"/>
  <text class="small-label" x="405" y="242">1. prepare</text>

  <path class="arrow-soft" d="M505 356 C455 420, 415 420, 365 356"/>
  <rect class="label-bg" x="370" y="430" width="208" height="40"/>
  <text class="label" x="385" y="458">2. SAS URL を返す</text>

  <path class="arrow-soft" d="M365 326 C650 525, 1110 525, 1450 326"/>
  <rect class="label-bg" x="760" y="525" width="270" height="42"/>
  <text class="label" x="780" y="554">3. direct PUT with SAS</text>

  <path class="arrow-soft" d="M365 368 C430 500, 490 500, 505 368"/>
  <rect class="label-bg" x="405" y="505" width="145" height="40"/>
  <text class="label" x="420" y="533">4. complete</text>

  <path class="arrow" d="M805 296 L970 296"/>
  <rect class="label-bg" x="820" y="218" width="250" height="34"/>
  <text class="small-label" x="835" y="242">5. Blob properties 確認</text>

  <path class="arrow" d="M1270 311 L1450 311"/>

  <path class="arrow-db" d="M655 370 L655 735"/>
  <rect class="label-bg" x="675" y="585" width="105" height="38"/>
  <text class="label" x="690" y="611">状態更新</text>

  <path class="arrow-mi" d="M720 370 C755 520, 815 650, 920 735"/>
  <rect class="label-bg" x="785" y="617" width="105" height="36"/>
  <text class="small-label" x="800" y="642">MIで認証</text>

  <path class="arrow-mi" d="M1200 794 L1325 794"/>
  <rect class="label-bg" x="1220" y="758" width="105" height="34"/>
  <text class="small-label" x="1235" y="781">権限付与</text>

  <path class="arrow-mi" d="M1485 735 C1425 585, 1260 510, 1130 370"/>
  <rect class="label-bg" x="1325" y="585" width="135" height="36"/>
  <text class="small-label" x="1340" y="610">Blob操作権限</text>

  <rect class="callout" x="155" y="925" width="1490" height="78" rx="12"/>
  <text class="label" x="190" y="974">ポイント: SAS URL は API から Browser へ返す。Storage へ送るものではない。</text>
</svg>
